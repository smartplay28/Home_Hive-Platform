# ─── Test-specific application properties ────────────────────────────────────
# Loaded automatically during tests (overrides main application.properties)
# Testcontainers injects its own mongo URI via MongoTestContainer.Initializer,
# so the value here is just a safe fallback.

spring.data.mongodb.uri=mongodb://localhost:27017/urban_crap_test

# Disable Redis auto-configuration for tests (Testcontainers doesn't provide Redis)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration

# Disable async to make tests deterministic (no thread pool side effects)
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1

# Suppress actuator noise in test output
management.endpoints.web.exposure.include=health

# Shorter JWT expiry for test speed (1 minute instead of 15 minutes)
app.jwt.access-token-expiry-ms=60000

# MongoDB auto-index for test collections
spring.data.mongodb.auto-index-creation=true

# Quieter logging during tests
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework.security=WARN
logging.level.com.example.UC_Backend=INFO
