# Application
spring.application.name=UC-Backend
server.port=8080

# MongoDB — set MONGO_URI in your environment or .env file. Never commit credentials.
# Example: MONGO_URI=mongodb+srv://<user>:<password>@cluster0.xxx.mongodb.net/Urban_Crap
spring.data.mongodb.uri=${MONGO_URI}

# JWT Configuration
# JWT — generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000
jwt.refresh.expiration.ms=604800000

# CORS (frontend dev URL + Vercel production URL)
app.cors.allowed-origins=${CORS_ORIGINS:https://home-hive-platform.vercel.app,http://localhost:5173,http://localhost:3000}

# Actuator (health + info endpoints)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Async thread pool
app.async.core-pool-size=10
app.async.max-pool-size=50
app.async.queue-capacity=200

# Logging
logging.level.com.example.UC_Backend=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Redis Cache
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# Cache TTLs (agent data: 30s, order history: 60s)
app.cache.agents-ttl-seconds=30
app.cache.orders-ttl-seconds=60

# MongoDB auto-index creation (creates @Indexed and @CompoundIndex on startup)
spring.data.mongodb.auto-index-creation=true